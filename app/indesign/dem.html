<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101014"><title>DEM Player - indesign</title>
<style>
:root{color-scheme:dark;--accent:#9ba9ff;--bg:#101014;--panel:#19191f;--text:#f7f7fa;--muted:#a5a5b2;--line:#ffffff20}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Helvetica,Arial,sans-serif;min-height:100vh}
.dem-backdrop{position:fixed;inset:-10%;z-index:-2;background-position:center;background-size:cover;filter:blur(90px) saturate(1.3);opacity:.36;transform:scale(1.15)}
.dem-backdrop:after{content:"";position:absolute;inset:0;background:#0b0b10b8}
.dem-shell{width:min(960px,calc(100% - 36px));margin:auto;padding:24px 0 48px}
.dem-powered{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:1.5px;color:#ddd;text-transform:lowercase}
.dem-powered b{font-weight:800;color:white}.dem-powered span{color:var(--accent)}
.dem-content{display:grid;grid-template-columns:300px minmax(0,1fr);gap:44px;align-items:start;margin:56px 0}
.dem-art{width:100%;aspect-ratio:1;object-fit:cover;background:#25252c;box-shadow:0 25px 70px #0008}
.dem-title{font-size:clamp(28px,5vw,48px);letter-spacing:-2px;margin:24px 0 6px}.dem-artist{font-size:14px;color:var(--muted)}
.dem-player{margin-top:28px;padding:18px;background:#ffffff0c;border:1px solid var(--line);backdrop-filter:blur(18px)}
.dem-audio-controls{display:flex;align-items:center;gap:10px}.dem-audio-controls button{width:36px;height:36px;border:0;background:var(--accent);color:#101014;font-size:12px;cursor:pointer}.dem-audio-controls input{flex:1;min-width:20px;accent-color:var(--accent);cursor:pointer}.dem-audio-controls span{min-width:76px;text-align:right;font-size:10px;font-variant-numeric:tabular-nums}
.dem-player audio::-webkit-media-controls-panel{background:#e9e9ee}
.dem-track-meta{display:flex;justify-content:space-between;gap:12px;margin-top:8px;color:var(--muted);font-size:10px}
.dem-lyrics{padding:24px 0}.dem-lyrics h2{font-size:11px;letter-spacing:2px;color:var(--muted);margin:0 0 18px}
.dem-line{display:block;width:100%;padding:12px 14px;margin:4px 0;border:1px solid transparent;background:transparent;color:#c4c4ce;text-align:left;font:500 16px/1.5 Helvetica,Arial,sans-serif;cursor:pointer;transition:.18s}
.dem-line small{display:block;font-size:8px;letter-spacing:1.4px;color:#8c8c9b;margin-bottom:4px}.dem-line em{display:block;margin-top:4px;color:var(--accent);font-size:11px;font-style:normal}.dem-line .dem-original{display:block}.dem-line .dem-romanized,.dem-line .dem-translation{display:block;margin-top:9px;padding-left:11px;border-left:1px solid #ffffff24;color:#b9bbca;font-size:12px;line-height:1.55}.dem-line .dem-romanized{color:#d0d3e4}.dem-line .dem-romanized b,.dem-line .dem-translation b{display:block;margin-bottom:2px;color:var(--accent);font-size:8px;letter-spacing:1.2px;font-weight:700}
.dem-line.active{background:#ffffff12;border-color:color-mix(in srgb,var(--accent),transparent 55%);color:white;transform:translateX(5px)}
.dem-credits{margin-top:30px;padding:20px;background:#ffffff0a;border:1px solid var(--line);font-size:11px;line-height:1.8;color:var(--muted)}
.dem-credits strong{color:white}.dem-footer{text-align:center;padding:20px 0;color:#858592;font-size:9px;letter-spacing:1px}
.dem-state{padding:70px 0;text-align:center;color:var(--muted)}.dem-state h1{color:white;font-size:28px}
@media(max-width:700px){.dem-content{grid-template-columns:1fr;gap:16px;margin:36px 0}.dem-art{width:min(72vw,300px);margin:auto}.dem-info{text-align:center}.dem-player{text-align:left}.dem-line{font-size:14px}}
</style>
</head>
<body>
<div class="dem-backdrop" id="dem-backdrop"></div>
<div class="dem-shell">
<header class="dem-powered"><b>powered by indesign<span>.</span></b><span>HRMNX MUSIC DEVELOPMENT</span></header>
<main id="dem-app"><div class="dem-state">Loading DEM…</div></main>
<footer class="dem-footer">powered by indesign · © 2026 indesign</footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../../js/supabase.js?v=2"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
(async()=>{
const app=document.getElementById("dem-app"),params=new URLSearchParams(location.search),slug=params.get("id");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
if(!slug){app.innerHTML='<div class="dem-state"><h1>DEM not found</h1><p>This link is incomplete.</p></div>';return;}
try{
const {data:record,error}=await window.supabaseClient.from("indesign_dems").select("title,artist,package_path").eq("slug",slug).eq("is_public",true).maybeSingle();
if(error)throw error;if(!record)throw new Error("This DEM may have been removed or the link is incorrect.");
const {data:asset,error:downloadError}=await window.supabaseClient.storage.from("indesign-dems").download(record.package_path);
if(downloadError)throw downloadError;
const zip=await JSZip.loadAsync(asset),manifestFile=zip.file("manifest.json");if(!manifestFile)throw new Error("The DEM package is incomplete.");
const manifest=JSON.parse(await manifestFile.async("string"));if(manifest.format!=="indesign-dem"||manifest.version!==1)throw new Error("Unsupported DEM format.");
let audioUrl="",coverUrl="";
const audioPath="audio/"+manifest.assets.audio;if(zip.file(audioPath)){const blob=await zip.file(audioPath).async("blob");audioUrl=URL.createObjectURL(blob);}
if(manifest.assets.artwork&&zip.file("artwork/"+manifest.assets.artwork)){coverUrl=URL.createObjectURL(await zip.file("artwork/"+manifest.assets.artwork).async("blob"));}
if(coverUrl){document.getElementById("dem-backdrop").style.backgroundImage='url("'+coverUrl+'")';}
const rules=(manifest.lyrics?.rules||[]).slice().sort((a,b)=>a.time-b.time);
app.innerHTML='<section class="dem-content"><div class="dem-info">'+(coverUrl?'<img class="dem-art" src="'+coverUrl+'" alt="Cover artwork">':'<div class="dem-art"></div>')+'<h1 class="dem-title">'+esc(manifest.title||record.title)+'</h1><div class="dem-artist">'+esc(manifest.artist||record.artist)+'</div><div class="dem-player">'+(audioUrl?'<audio id="dem-audio" preload="metadata" src="'+audioUrl+'" hidden></audio><div class="dem-audio-controls"><button type="button" id="dem-play" aria-label="Play or pause">▶</button><input id="dem-seek" type="range" min="0" max="1000" value="0" aria-label="Seek through audio"><span id="dem-time">00:00 / 00:00</span></div>':'<p>Audio unavailable.</p>')+'<div class="dem-track-meta"><span>'+esc(manifest.production?.bpm||"")+(manifest.production?.bpm?" BPM":"")+'</span><span>'+esc(manifest.production?.key||"")+'</span></div></div></div><div class="dem-lyrics"><h2>SYNCED LYRICS</h2><div id="dem-lines">'+(rules.length?rules.map((r,i)=>'<button class="dem-line" data-time="'+Number(r.time||0)+'"><small>'+esc(r.section||"LYRICS")+' · RULE '+esc(r.number)+'</small><span class="dem-original">'+esc(r.text)+'</span>'+(r.romanized?'<span class="dem-romanized"><b>ROMANIZATION</b>'+esc(r.romanized)+'</span>':'')+(r.translations?.length?r.translations.map(t=>'<span class="dem-translation"><b>'+esc((t.language||"TRANSLATION").toUpperCase())+'</b>'+esc(t.text)+'</span>').join(""):'')+(r.adlibs?.length?'<em>'+esc(r.adlibs.join(" / "))+'</em>':'')+'</button>').join(""):'<p class="dem-state">Instrumental DEM</p>')+'</div><div class="dem-credits"><strong>Credits</strong><br>Artist: '+esc(manifest.artist)+'<br>Producer(s): '+esc((manifest.production?.producers||[]).join(", ")||"—")+'<br>'+esc(manifest.production?.credits||"")+'</div></div></section>';
const audio=document.getElementById("dem-audio"),lines=[...document.querySelectorAll("[data-time]")];
if(audio){const play=document.getElementById("dem-play"),seek=document.getElementById("dem-seek"),time=document.getElementById("dem-time"),fmt=t=>String(Math.floor(t/60)).padStart(2,"0")+":"+String(Math.floor(t%60)).padStart(2,"0");play.addEventListener("click",()=>audio.paused?audio.play().catch(()=>{}):audio.pause());audio.addEventListener("play",()=>play.textContent="Ⅱ");audio.addEventListener("pause",()=>play.textContent="▶");audio.addEventListener("timeupdate",()=>{let active=-1;lines.forEach((line,i)=>{if(Number(line.dataset.time)<=audio.currentTime)active=i;});lines.forEach((line,i)=>line.classList.toggle("active",i===active));if(active>=0)lines[active].scrollIntoView({block:"nearest",behavior:"smooth"});if(audio.duration){seek.value=Math.round(audio.currentTime/audio.duration*1000);time.textContent=fmt(audio.currentTime)+" / "+fmt(audio.duration);}});audio.addEventListener("loadedmetadata",()=>time.textContent="00:00 / "+fmt(audio.duration));seek.addEventListener("input",()=>{if(audio.duration)audio.currentTime=audio.duration*Number(seek.value)/1000;});lines.forEach(line=>line.addEventListener("click",()=>{audio.currentTime=Number(line.dataset.time);audio.play().catch(()=>{});}));}
}catch(error){app.innerHTML='<div class="dem-state"><h1>Could not load this DEM</h1><p>'+esc(error.message||"Please try again later.")+'</p></div>';}
})();
</script>
</body></html>
