    <link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@700&display=swap" rel="stylesheet">

        <div class="workspace-label">

                >
                    <span><svg class="hrmnx-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/></svg></span>

            </div>


            <div class="nav-group">

                    <span><svg class="hrmnx-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2L12 3Z"/></svg></span>

                <button

                    <span><svg class="hrmnx-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>

                </button>

            </div>


            <div class="nav-group">

                <div class="nav-group-title">
                    KIKI
                </div>

                <button
                    class="nav-item"
                    data-section="kiki-posts"
                >
                    <span><svg class="hrmnx-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5 4 4M4 20l4-.8L19 8a2.1 2.1 0 0 0-3-3L5 16l-1 4Z"/></svg></span>

                <button

                    <span><svg class="hrmnx-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 3h16v18H4zM8 8h8M8 12h8"/></svg></span>

            <div class="nav-group">

                <div class="nav-group-title">
                    HRMNX AUDITION
                </div>

                <button
                    class="nav-item"
                    data-section="auditions"

                    <span><svg class="hrmnx-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg></span>

                    <span><svg class="hrmnx-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 9v12"/></svg></span>

        <div class="sidebar-bottom">

            <button
                id="sign-out-button"
                class="sign-out"
            >
                Sign out
            </button>

        </div>

    <main class="dashboard">


        <header class="dashboard-header">

            <div>

                <div
                    id="section-label"
                    class="section-label"
                >
                    HRMNX ADMINISTRATION
                </div>

                <h1 id="section-title">
                    Overview
                </h1>

            </div>


            <div class="user-area">

                <div class="user-avatar">
                    <span id="user-avatar-letter">
                        ?
                    </span>
                </div>

                <div>

                    <strong id="user-name">
                        Loading...
                    </strong>

                    <span id="user-role">
                        Checking permissions...
                    </span>

                </div>

            </div>

        </header>



        <section
            id="dashboard-content"
            class="dashboard-content"
        >

            <!-- Loaded by dashboard.js -->

        </section>


    </main>



    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="js/supabase.js"></script>
    <script src="js/hrmnx-icons.js?v=20261114-2"></script>

    <script src="js/dashboard.js"></script>

    <script src="js/prodem-format.js"></script>
