<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nemawashi — Sign in</title>
<style>
*{box-sizing:border-box}
:root{--accent:#636BD8;--text:#17182a;--muted:#77798d;--border:rgba(99,107,216,.14)}
body{margin:0;min-height:100vh;font-family:"Noto Sans JP","Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 15% 15%,rgba(99,107,216,.13),transparent 32%),radial-gradient(circle at 85% 85%,rgba(99,107,216,.10),transparent 30%),linear-gradient(135deg,#fff,#f7f7ff);display:flex;align-items:center;justify-content:center;padding:30px 18px}
.login-shell{width:100%;max-width:440px}
.brand{text-align:center;margin-bottom:24px}.brand img{width:82px;height:auto;margin-bottom:12px}.brand h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.04em}.brand p{margin:6px 0 0;color:var(--muted);font-size:13px}
.card{background:rgba(255,255,255,.88);border:1px solid var(--border);border-radius:24px;padding:30px;box-shadow:0 20px 60px rgba(45,48,100,.10);backdrop-filter:blur(18px)}
.card h2{margin:0 0 6px;font-size:21px}.intro{margin:0 0 24px;color:var(--muted);font-size:13px;line-height:1.6}
.field{margin-bottom:16px}label{display:block;margin-bottom:7px;font-size:12px;font-weight:700}input{width:100%;border:1px solid var(--border);border-radius:13px;padding:12px 14px;outline:none;background:#fff;color:var(--text);font:inherit;font-size:14px}input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(99,107,216,.10)}
.button{width:100%;border:0;border-radius:13px;padding:13px 16px;margin-top:5px;background:var(--accent);color:#fff;font:inherit;font-size:14px;font-weight:800;cursor:pointer}.button:disabled{opacity:.55;cursor:wait}
.message{display:none;margin:0 0 18px;padding:11px 13px;border-radius:12px;font-size:13px;line-height:1.5}.message.show{display:block}.message.error{background:#fff0f1;color:#a52d3a}.message.success{background:#eefbf3;color:#247044}
.links{display:flex;justify-content:space-between;gap:12px;margin-top:20px;font-size:13px}.links a{color:var(--accent);font-weight:700;text-decoration:none}
.signup{text-align:center;margin-top:22px;padding-top:20px;border-top:1px solid var(--border);color:var(--muted);font-size:13px}.signup a{color:var(--accent);font-weight:700;text-decoration:none}
.note{margin-top:18px;padding:12px 14px;border-radius:13px;background:rgba(99,107,216,.09);color:var(--muted);font-size:11px;line-height:1.55}
</style>
</head>
<body>
<main class="login-shell">
<div class="brand">
<img src="images/nemawashi-logo.png" alt="Nemawashi">
<h1>Nemawashi</h1>
<p>Hrmnx Entertainment internal workspace</p>
</div>

<section class="card">
<h2>Welcome back</h2>
<p class="intro">Sign in to continue to your Nemawashi workspace.</p>

<div id="message" class="message"></div>

<form id="login-form">
<div class="field">
<label for="email">Email</label>
<input id="email" type="email" autocomplete="email" placeholder="you@example.com" required>
</div>

<div class="field">
<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password" placeholder="Your password" required>
</div>

<button id="login-button" class="button" type="submit">Sign in</button>
</form>

<div class="links">
<a href="reset-password.html">Forgot password?</a>
<a href="index.html">Back</a>
</div>

<div class="signup">
Don't have a Nemawashi account?
<a href="signup.html">Create account</a>
</div>

<div class="note">
Use the same Hrmnx/Supabase account that has access to Nemawashi.
</div>
</section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
const form = document.getElementById("login-form");
const button = document.getElementById("login-button");
const message = document.getElementById("message");

function showMessage(text, type) {
    message.textContent = text;
    message.className = "message show " + type;
}

form.addEventListener("submit", async function(event) {
    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    button.disabled = true;
    button.textContent = "Signing in...";
    message.className = "message";

    try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
            email,
            password
        });

        if (error) throw error;

        if (!data.session) {
            throw new Error("Sign-in succeeded, but no active session was created.");
        }

        showMessage("Signed in successfully. Redirecting...", "success");

        setTimeout(function() {
            window.location.href = "dashboard.html";
        }, 500);

    } catch (error) {
        console.error("Nemawashi login error:", error);

        showMessage(
            error.message || "Could not sign in.",
            "error"
        );

        button.disabled = false;
        button.textContent = "Sign in";
    }
});
</script>
</body>
</html>
