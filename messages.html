<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>根回し - Messages</title>
    <link rel="icon" type="image/x-icon" href="images/nemawashi-favicon.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@700&display=swap" rel="stylesheet">

    <link
        rel="stylesheet"
        href="css/messages.css?v=20261114-2"
    >
    <link rel="stylesheet" href="css/nemawashi-broadcast-mode.css">

</head>


<body>

    <div class="messages-app">


        <!-- ==================================================
             LEFT SIDEBAR
        =================================================== -->

        <aside class="messages-sidebar">


            <!-- BRAND -->

            <div class="messages-brand">

                <a
                    href="dashboard.html"
                    class="messages-brand-link"
                >

                    <img
                        src="images/nemawashi-logo.png"
                        alt="Nemawashi"
                    >

                </a>

            </div>


            <!-- MAIN NAVIGATION -->

            <nav class="messages-navigation">


                <div class="navigation-label">
                    NEMAWASHI
                </div>


                <button
                    type="button"
                    class="navigation-item active"
                    data-page="home"
                >

                    <span class="navigation-icon">
                        ◈
                    </span>

                    <span>
                        Nemawashi
                    </span>

                </button>


                <button
                    type="button"
                    class="navigation-item"
                    data-page="personal"
                >

                    <span class="navigation-icon">
                        <svg class="hrmnx-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 9 9 0 0 1-4-.9L3 21l1.9-5.5a9 9 0 0 1-.9-4A8.5 8.5 0 0 1 12.5 3H13a8.5 8.5 0 0 1 8 8v.5Z"/></svg>
                    </span>

                    <span>
                        Personal Messages
                    </span>

                </button>


                <button
                    type="button"
                    class="navigation-item"
                    data-page="subsidiary"
                >

                    <span class="navigation-icon">
                        <svg class="hrmnx-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 9 9 0 0 1-4-.9L3 21l1.9-5.5a9 9 0 0 1-.9-4A8.5 8.5 0 0 1 12.5 3H13a8.5 8.5 0 0 1 8 8v.5Z"/></svg>
                    </span>

                    <span>
                        Subsidiary Messages
                    </span>

                </button>


                <button
                    type="button"
                    class="navigation-item"
                    data-page="business"
                >

                    <span class="navigation-icon">
                        <svg class="hrmnx-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 9 9 0 0 1-4-.9L3 21l1.9-5.5a9 9 0 0 1-.9-4A8.5 8.5 0 0 1 12.5 3H13a8.5 8.5 0 0 1 8 8v.5Z"/></svg>
                    </span>

                    <span>
                        Business Messages
                    </span>

                </button>


                <!-- APPS -->

                <div class="navigation-apps">


                    <button
                        type="button"
                        class="navigation-item apps-toggle"
                        id="apps-toggle"
                    >

                        <span class="navigation-icon">
                            <svg class="hrmnx-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                        </span>

                        <span>
                            Apps
                        </span>

                        <span
                            class="apps-toggle-arrow"
                            id="apps-toggle-arrow"
                        >
                            ›
                        </span>

                    </button>


                    <div
                        class="apps-list"
                        id="apps-list"
                    >

                        <button
                            type="button"
                            class="app-navigation-item"
                            data-app="nemawashi"
                        >

                            <span class="app-sidebar-icon">
                                N
                            </span>

                            <span>
                                Nemawashi
                            </span>

                        </button>


                        <button
                            type="button"
                            class="app-navigation-item"
                            data-app="kiki"
                        >

                            <span class="app-sidebar-icon">
                                K
                            </span>

                            <span>
                                KiKi
                            </span>

                        </button>


                        <button
                            type="button"
                            class="app-navigation-item"
                            data-app="audition"
                        >

                            <span class="app-sidebar-icon">
                                A
                            </span>

                            <span>
                                Audition
                            </span>

                        </button>


                        <button
                            type="button"
                            class="app-navigation-item"
                            data-app="serashio"
                        >

                            <span class="app-sidebar-icon">
                                S
                            </span>

                            <span>
                                Serashio
                            </span>

                        </button>


                        <button
                            type="button"
                            class="app-navigation-item"
                            data-app="hrmnx-entertainment"
                        >

                            <span class="app-sidebar-icon">
                                H
                            </span>

                            <span>
                                Hrmnx Entertainment
                            </span>

                        </button>


                        <button
                            type="button"
                            class="app-navigation-item"
                            data-app="yumeworld"
                        >

                            <span class="app-sidebar-icon">
                                Y
                            </span>

                            <span>
                                Yumeworld
                            </span>

                        </button>


                        <button
                            type="button"
                            class="app-navigation-item"
                            data-app="seiun"
                        >

                            <span class="app-sidebar-icon">
                                S
                            </span>

                            <span>
                                SEIUN
                            </span>

                        </button>


                        <button
                            type="button"
                            class="app-navigation-item"
                            data-app="hoshi"
                        >

                            <span class="app-sidebar-icon">
                                H
                            </span>

                            <span>
                                HOSHI
                            </span>

                        </button>


                        <button
                            type="button"
                            class="app-navigation-item"
                            data-app="osakos-diary"
                        >

                            <span class="app-sidebar-icon">
                                O
                            </span>

                            <span>
                                Osako's Diary
                            </span>

                        </button>


                        <button
                            type="button"
                            class="app-navigation-item"
                            data-app="harmonia"
                        >

                            <span class="app-sidebar-icon">
                                H
                            </span>

                            <span>
                                Harmonia
                            </span>

                        </button>


                        <button
                            type="button"
                            class="app-navigation-item"
                            data-app="links"
                        >

                            <span class="app-sidebar-icon">
                                L
                            </span>

                            <span>
                                Links
                            </span>

                        </button>


                    </div>

                </div>


                <!-- APP BUILDER -->

                <button
                    type="button"
                    class="navigation-item"
                    data-page="app-builder"
                >

                    <span class="navigation-icon">
                        <svg class="hrmnx-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                    </span>

                    <span>
                        App Builder
                    </span>

                </button>


            </nav>


            <!-- BOTTOM -->

            <div class="messages-sidebar-bottom">

                <a
                    href="dashboard.html"
                    class="return-dashboard"
                >

                    <svg class="hrmnx-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6M9 12h12"/></svg> Administration

                </a>

            </div>


        </aside>


        <!-- ==================================================
             APP AREA
        =================================================== -->

        <main class="messages-main">


            <!-- TOP BAR -->

            <header class="messages-topbar">

                <div>

                    <span
                        class="messages-topbar-label"
                        id="topbar-label"
                    >
                        NEMAWASHI
                    </span>

                    <h1 id="topbar-title">
                        Nemawashi
                    </h1>

                </div>


                <div class="messages-topbar-actions">

                    <button
                        type="button"
                        class="topbar-button"
                        id="search-button"
                    >
                        Search
                    </button>

                </div>

            </header>


            <!-- CONTENT -->

            <section
                class="messages-content"
                id="messages-content"
            >

                <!-- JavaScript renders content here -->

            </section>


        </main>


    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/hrmnx-icons.js?v=20261114-6"></script>
    <script src="js/messages.js?v=20261114-3"></script>
    <script src="js/personal-messages.js?v=20261114-2"></script>
    <script src="js/nemawashi-broadcast-mode.js"></script>

</body>

</html>
