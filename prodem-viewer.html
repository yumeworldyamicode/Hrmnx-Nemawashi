<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PRODEM — Nemawashi</title>

    <link
        rel="icon"
        type="image/x-icon"
        href="images/nemawashi-favicon.ico"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            background: #f4f4f7;
            color: #292a35;
            font-family:
                "LINE Seed JP",
                sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;
        }


        .prodem-page {
            width: 100%;
            max-width: 620px;
        }


        .prodem-card {
            background: #ffffff;
            border: 1px solid #e5e5eb;
            border-radius: 22px;
            padding: 30px;

            box-shadow:
                0 18px 50px
                rgba(0, 0, 0, 0.08);
        }


        .prodem-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            opacity: 0.5;
            margin-bottom: 8px;
        }


        .prodem-title {
            margin: 0;
            font-size: 26px;
            line-height: 1.2;
        }


        .prodem-file-name {
            margin-top: 7px;
            font-size: 14px;
            opacity: 0.6;
            word-break: break-word;
        }


        .prodem-status {
            margin-top: 24px;
            padding: 13px 15px;
            border-radius: 12px;
            background: #f4f4f7;
            font-size: 13px;
        }


        .prodem-status.error {
            background: #fff0f0;
            color: #a32929;
        }


        .prodem-player {
            display: none;
            margin-top: 28px;
        }


        .prodem-player.visible {
            display: block;
        }


        .prodem-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }


        .prodem-play-button {
            width: 48px;
            height: 48px;

            border: 0;
            border-radius: 50%;

            background: #292a35;
            color: #ffffff;

            cursor: pointer;

            font-size: 17px;
            line-height: 1;
        }


        .prodem-play-button:hover {
            opacity: 0.88;
        }


        .prodem-progress {
            flex: 1;
            height: 7px;

            appearance: none;
            -webkit-appearance: none;

            border: 0;
            border-radius: 999px;

            background: #e3e3e8;

            cursor: pointer;
        }


        .prodem-progress::-webkit-slider-thumb {
            appearance: none;
            -webkit-appearance: none;

            width: 15px;
            height: 15px;

            border-radius: 50%;
            border: 0;

            background: #292a35;
        }


        .prodem-progress::-moz-range-thumb {
            width: 15px;
            height: 15px;

            border-radius: 50%;
            border: 0;

            background: #292a35;
        }


        .prodem-time {
            min-width: 82px;
            text-align: right;
            font-size: 12px;
            opacity: 0.55;
            font-variant-numeric: tabular-nums;
        }


        .prodem-info {
            margin-top: 18px;

            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }


        .prodem-info-item {
            padding: 6px 9px;

            border-radius: 8px;

            background: #f4f4f7;

            font-size: 11px;
            opacity: 0.65;
        }


        .prodem-back {
            display: inline-block;
            margin-top: 20px;

            color: inherit;
            text-decoration: none;

            font-size: 13px;
            opacity: 0.55;
        }


        .prodem-back:hover {
            opacity: 1;
        }

    </style>

</head>


<body>

    <main class="prodem-page">

        <section class="prodem-card">

            <div class="prodem-label">
                Nemawashi PRODEM
            </div>

            <h1 class="prodem-title">
                Demo Audio
            </h1>

            <div
                class="prodem-file-name"
                id="prodem-file-name"
            >
                Loading...
            </div>


            <div
                class="prodem-status"
                id="prodem-status"
            >
                Verifying access...
            </div>


            <div
                class="prodem-player"
                id="prodem-player"
            >

                <div class="prodem-controls">

                    <button
                        type="button"
                        class="prodem-play-button"
                        id="prodem-play-button"
                        aria-label="Play"
                    >
                        ▶
                    </button>


                    <input
                        type="range"
                        class="prodem-progress"
                        id="prodem-progress"
                        min="0"
                        max="100"
                        value="0"
                        step="0.1"
                    >


                    <div
                        class="prodem-time"
                        id="prodem-time"
                    >
                        0:00 / 0:00
                    </div>

                </div>


                <div
                    class="prodem-info"
                    id="prodem-info"
                >
                </div>

            </div>


            <a
                href="messages.html"
                class="prodem-back"
            >
                ← Back to Nemawashi
            </a>

        </section>

    </main>


    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="js/supabase.js"></script>

    <script src="js/prodem-format.js"></script>

    <script src="js/prodem-viewer.js"></script>

</body>

</html>
