<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nemawashi Website</title>
<link rel="icon" href="/images/nemawashi-favicon.ico">
<style>
:root{font-family:system-ui,sans-serif;color:#111;background:#fff}*{box-sizing:border-box}body{margin:0;min-height:100vh}.loading{min-height:100vh;display:grid;place-items:center;background:#09090d;color:#fff}.loading div{text-align:center}.loading strong{font-size:40px;display:block;margin-bottom:10px}.error{max-width:650px;margin:15vh auto;padding:30px;border:1px solid #ddd;border-radius:18px}.eyebrow{font-size:10px;letter-spacing:.14em;font-weight:800}.site-nav{position:relative;z-index:5}.nav-inner{min-height:70px;padding:0 6%;display:flex;align-items:center;justify-content:space-between}.brand-link{font-weight:800;color:inherit;text-decoration:none}.nav-links{display:flex;gap:22px}.nav-links a{color:inherit;text-decoration:none}.announcement{padding:10px 18px;text-align:center}.shop-block{max-width:1440px;margin:auto;padding:60px 6%}.shop-grid{display:grid;grid-template-columns:repeat(var(--columns,4),minmax(0,1fr));gap:20px}.shop-card{overflow:hidden;border:1px solid rgba(0,0,0,.12);border-radius:16px}.shop-card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.shop-card-content{padding:17px}.shop-card a{color:inherit;text-decoration:none}.review-card{padding:20px;border:1px solid rgba(0,0,0,.12);border-radius:16px}footer{padding:35px 6%;text-align:center;border-top:1px solid rgba(0,0,0,.12)}@media(max-width:800px){.shop-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.nav-links{gap:10px;font-size:13px}}@media(max-width:520px){.shop-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"><div class="loading"><div><strong>根</strong><span>Loading website…</span></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase.js"></script>
<script src="/public-app.js"></script>
</body>
</html>
